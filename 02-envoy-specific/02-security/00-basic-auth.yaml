# Basic Auth on the example-app-go HTTPRoute.
# Entries must be generated with `htpasswd -s <user> <password>` (Apache
# {SHA} format = base64(sha1(password))) — Envoy Gateway rejects bcrypt here.
# The hash below is for demo-user / demo-password — swap before real use.
apiVersion: v1
kind: Secret
metadata:
  name: example-app-basic-auth
  namespace: envoy-gateway-system
type: Opaque
stringData:
  # generated with: htpasswd -nbs demo-user demo-password
  # key MUST be named ".htpasswd" — Envoy Gateway looks up this exact key.
  .htpasswd: |
    demo-user:{SHA}POjQMNQW1NfYyWtu4ZyNpwwV7k4=
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: example-app-basic-auth
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: example-app-go
  basicAuth:
    users:
      name: example-app-basic-auth


# curl -i --resolve example-app.com:443:$GATEWAY_HOST --cacert gw-demo-ca.crt https://example-app.com/ # unauthorized 401
# curl -u demo-user:demo-password --resolve example-app.com:443:$GATEWAY_HOST --cacert gw-demo-ca.crt https://example-app.com/